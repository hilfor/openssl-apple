name: CI

on:
  push:
    tags:
    - 'v*'

# The release step both creates the release and uploads to it; the default
# GITHUB_TOKEN grant is read-only. Scoped to this repository and this run, and
# it expires with the run.
permissions:
  contents: write

jobs:
  build:
    name: Building release assets

    # Pinned image: build-libssl.sh passes -mios-version-min=26.0, so the build
    # needs an iOS 26 SDK, and macos-latest is free to roll back to an image
    # that has none.
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v4

    # Assert the requirement rather than xcode-select a version path. Hardcoding
    # /Applications/Xcode_26.5.app is how the consuming app's Makefile used to
    # do it, and it broke every target the day that app was rotated off the
    # image -- GitHub gives about two weeks' notice and the macos-26 default has
    # already moved once. What the build actually needs is an iOS SDK >= 26.0;
    # check for that, and say what is available when it is missing.
    - name: Verify the toolchain has an iOS 26 SDK
      run: |
        set -euo pipefail
        xcodebuild -version
        sdk=$(xcrun --sdk iphoneos --show-sdk-version)
        echo "active iOS SDK: ${sdk}"
        if [ "$(printf '%s\n26.0\n' "$sdk" | sort -V | head -1)" != "26.0" ]; then
          echo "✗ need an iOS SDK >= 26.0 for -mios-version-min=26.0; installed Xcodes:"
          ls -d /Applications/Xcode*.app
          exit 1
        fi

    - name: build-openssl
      run: swift run

    # build-libssl.sh writes each target's compiler output to bin/<sdk>/*.log and
    # prints only a one-line pointer to it on failure. The runner is destroyed
    # after the job, so without this a failed tag push leaves nothing to read.
    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: bin/**/*.log
        if-no-files-found: ignore

    # Pinned by commit, not by the v2 tag: this action is granted contents:write
    # on the repository that publishes the binary an App Store app embeds, and a
    # tag can be moved. 3bb1273 is what v2 pointed at when this was recorded.
    #
    # release.md is written by Sources/openssl-apple/main.swift and carries the
    # OpenSSL version, the fork commit, the toolchain, and the SHA-256 of every
    # asset below -- openssl-libs.zip included, which is the one consumers pin.
    - name: Create release and upload assets
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
      with:
        body_path: release.md
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        files: |
          openssl-dynamic.xcframework.zip
          openssl-static.xcframework.zip
          openssl-libs.zip
          openssl-dynamic.frameworks.zip
          openssl-static.frameworks.zip
