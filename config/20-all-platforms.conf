## -*- mode: perl; -*-

my %targets = ();

%targets = (
    ## Base settings for cross-compile
    # Based on 10-main.conf: iphoneos-cross
    # Add generic compiler flags
    # Add embed-bitcode option if SDK version is 9 or higher
    #
    # -fembed-bitcode is a deliberate no-op today: clang stopped emitting
    # bitcode and the linker's matching -bitcode_bundle was removed outright
    # (see create-openssl-framework.sh). It is left in place so this file stays
    # a minimal delta against the parent fork; check_bitcode() consequently
    # reports "doesn't contain Bitcode" for every slice, which is correct.
    "all-base" => {
        template         => 1,
        cflags           => combine('-isysroot $(CROSS_TOP)/SDKs/$(CROSS_SDK) -fno-common',
                                sub { ((!defined($ENV{'CONFIG_DISABLE_BITCODE'}) || $ENV{'CONFIG_DISABLE_BITCODE'} ne 'true') && defined($ENV{'SDKVERSION'}) && $ENV{'SDKVERSION'} =~ /^(9|[1-9][0-9]+)\./ && $disabled{shared})
                                        ? '-fembed-bitcode' : (); },
                            ),
    },

    ## Base settings
    "ios-cross-base" => {
        inherit_from    => [ "all-base" ],
        template         => 1,
        cflags           => add(sub { defined($ENV{'IOS_MIN_SDK_VERSION'}) ? '-mios-version-min=$(IOS_MIN_SDK_VERSION)' : '-mios-version-min=12.0'; }),
    },
    "macos-base" => {
        inherit_from    => [ "all-base" ],
        template         => 1,
        cflags           => add(sub { defined($ENV{'MACOS_MIN_SDK_VERSION'}) ? '-mmacosx-version-min=$(MACOS_MIN_SDK_VERSION)' : '-mmacosx-version-min=10.15'; }),
    },
    "mac-catalyst-base" => {
        inherit_from    => [ "all-base" ],
        template        => 1,
#        cflags          => add(sub { defined($ENV{'CATALYST_MIN_SDK_VERSION'}) ? '-mmacosx-version-min=$(CATALYST_MIN_SDK_VERSION)' : '-mmacosx-version-min=10.15'; }),
    },
    "watchos-cross-base" => {
        inherit_from    => [ "all-base" ],
        template         => 1,
        cflags           => add(sub { defined($ENV{'WATCH_MIN_SDK_VERSION'}) ? '-mwatchos-version-min=$(WATCH_MIN_SDK_VERSION)' : '-mwatchos-version-min=4.0'; }),
    },
    "tvos-cross-base" => {
        inherit_from    => [ "all-base" ],
        template         => 1,
        cflags           => add(sub { defined($ENV{'TVOS_MIN_SDK_VERSION'}) ? '-mtvos-version-min=$(TVOS_MIN_SDK_VERSION)' : '-mtvos-version-min=12.0'; }),
        defines          => [ "HAVE_FORK=0" ],
    },

    ## Apple iOS

    # Device
    "ios64-cross-arm64" => {
        inherit_from     => [ "darwin-common", "ios-cross-base" ],
        cflags           => add("-arch arm64"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
        sys_id           => "iOS",
    },
    # Not in DEFAULTTARGETS: third-party iOS apps do not ship arm64e -- it is
    # pointer authentication for system binaries. (App Store Connect rejected
    # the old artifact for carrying an arm64e slice built against the iOS 16.2
    # SDK; building on a current SDK would clear that specific complaint, which
    # is why the durable reason is the one above.) Kept reachable via --targets=.
    "ios64-cross-arm64e" => {
        inherit_from     => [ "darwin-common", "ios-cross-base" ],
        cflags           => add("-arch arm64e"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
        sys_id           => "iOS",
    },
    # Simulator
    "ios-sim-cross-x86_64" => {
        inherit_from     => [ "darwin64-x86_64-cc", "ios-cross-base" ],
        sys_id           => "iOS",
    },
    # The -target override is what makes this a simulator target at all:
    # darwin64-arm64-cc plus ios-cross-base's -mios-version-min describes an
    # arm64 *device*, and only the explicit triple says -simulator. x86_64 needs
    # no such override because that architecture cannot be a device.
    #
    # The version in the triple has to come from IOS_MIN_SDK_VERSION. It was
    # hardcoded at 14.0, so the arm64 image in the iPhoneSimulator slice recorded
    # minos 14.0 while x86_64 beside it recorded 26.0. The triple beats
    # -mios-version-min whichever order they appear in -- measured, clang says
    # "overriding '-mios-version-min=26.0' option with '-target ...'" either way.
    #
    # That warning is also why this line now carries the triple alone. The old
    # one appended a second -mios-version-min=14.0 *after* the triple; because it
    # agreed with the triple, clang fell silent, and the -Woverriding-option
    # warning that would have pointed straight at ios-cross-base's 26.0 never
    # appeared. With only the triple, any future divergence warns again.
    #
    # Nothing downstream objected either: create-openssl-framework.sh derives
    # Info.plist's MinimumOSVersion with get_min_sdk on the assembled fat
    # framework binary, which reports the first architecture -- x86_64. So the
    # plist advertised 26.0 over an arm64 image built for 14.0.
    #
    # No defined() fallback here, unlike the base templates: with
    # IOS_MIN_SDK_VERSION unset the make variable expands empty, the triple
    # becomes arm64-apple-ios-simulator, and clang takes the version from
    # ios-cross-base's flag -- which already carries this file's 12.0 default.
    # Measured; a second fallback would just be a second place to update.
    #
    # Single-quoted: in a double-quoted Perl string $( interpolates as the
    # real-GID variable. The literal reaches the generated Makefile and make
    # expands it, exactly as ios-cross-base's flag does.
    #
    # mac-catalyst-x86_64 and mac-catalyst-arm64 below hardcode 14.0 in this same
    # shape and are deliberately left alone: CATALYST_MIN_SDK_VERSION is 11.0,
    # under the 12.0 floor Xcode 27 accepts, so the symmetric change would not
    # build. Their two architectures agree with each other, so the artifact is
    # self-consistent -- just built at a target nothing here declares.
    "ios-sim-cross-arm64" => {
        inherit_from     => [ "darwin64-arm64-cc", "ios-cross-base" ],
        cflags           => add('-target arm64-apple-ios$(IOS_MIN_SDK_VERSION)-simulator'),
        sys_id           => "iOS",
    },

    ## Apple macOS

    # Device
    "macos64-x86_64" => {
        inherit_from     => [ "darwin64-x86_64-cc", "macos-base" ],
        sys_id           => "MacOSX",
    },
    "macos64-arm64" => {
        inherit_from     => [ "darwin64-arm64-cc", "macos-base" ],
        sys_id           => "MacOSX",
    },
    # Catalyst
    "mac-catalyst-x86_64" => {
        inherit_from      => [ "darwin64-x86_64-cc", "mac-catalyst-base" ],
        cflags            => add("-target x86_64-apple-ios14.0-macabi -mios-version-min=14.0"),
        sys_id            => "MacOSX",
    },
    "mac-catalyst-arm64" => {
        inherit_from     => [ "darwin64-arm64-cc", "mac-catalyst-base" ],
        cflags           => add("-target arm64-apple-ios14.0-macabi -mios-version-min=14.0"),
        sys_id           => "MacOSX",
    },

    ## Apple WatchOS

    # Device
    "watchos-cross-armv7k" => {
        inherit_from     => [ "darwin-common",  "watchos-cross-base" ],
        cflags           => add("-arch armv7k -fembed-bitcode"),
        asm_arch         => 'armv4',
        defines          => [ "HAVE_FORK=0" ],
        sys_id           => "WatchOS",
    },
    "watchos-cross-arm64_32" => {
        inherit_from     => [ "darwin-common", "watchos-cross-base"],
        cflags           => add("-arch arm64_32 -fembed-bitcode"),
        defines          => [ "HAVE_FORK=0" ],
        sys_id           => "WatchOS",
    },
    "watchos-cross-arm64" => {
        inherit_from     => [ "darwin-common", "watchos-cross-base" ],
        cflags           => add("-arch arm64 -fembed-bitcode"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
        defines          => [ "HAVE_FORK=0" ],
        sys_id           => "WatchOS",
    },
    # Simulator
    "watchos-sim-cross-x86_64" => {
        inherit_from     => [ "darwin64-x86_64-cc", "watchos-cross-base"],
        cflags           => add("-fembed-bitcode"),
        defines          => [ "HAVE_FORK=0" ],
        sys_id           => "WatchOS",
    },
    "watchos-sim-cross-i386" => {
        inherit_from     => [ "darwin-common", "watchos-cross-base"],
        cflags           => add("-arch i386 -fembed-bitcode"),
        defines          => [ "HAVE_FORK=0" ],
        sys_id           => "WatchOS",
    },

    ## Apple TV

    # Device
    "tvos64-cross-arm64" => {
        inherit_from     => [ "darwin-common", "tvos-cross-base" ],
        cflags           => add("-arch arm64"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
        sys_id           => "tvOS",
    },
    # Simulator
    "tvos-sim-cross-x86_64" => {
        inherit_from     => [ "darwin64-x86_64-cc", "tvos-cross-base" ],
        sys_id           => "tvOS",
    },
);
